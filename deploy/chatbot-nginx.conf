# KALP chatbot - Nginx reverse proxy config (Hostinger VPS)
# Install:  sudo cp deploy/chatbot-nginx.conf /etc/nginx/sites-available/chatbot
#           sudo ln -sf /etc/nginx/sites-available/chatbot /etc/nginx/sites-enabled/
#
# The service runs on 127.0.0.1:8000; this terminates HTTPS and forwards to it.
# proxy_buffering off is REQUIRED for the SSE chat-streaming endpoint.

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name chat.kalp-shop.in;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name chat.kalp-shop.in;

    # These paths are created by certbot:  sudo certbot --nginx -d chat.kalp-shop.in
    ssl_certificate     /etc/letsencrypt/live/chat.kalp-shop.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.kalp-shop.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Allow the widget + admin on the same origin.
    client_max_body_size 50m;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
        proxy_buffering     off;
    }
}
